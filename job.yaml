# Credentials live in Secret is-holiday-mqtt-mqtt (created by set-mqtt-user.sh), not in this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: is-holiday-mqtt-job
  namespace: loxone
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 3
      template:
        spec:
          containers:
          - name: is-holiday-mqtt
            image: harbor.cl.port17.de/library/is-holiday-mqtt:latest
            imagePullPolicy: Always
            env:
            - name: MQTT_BROKER
              value: mosquitto.mosquitto.svc
            - name: MQTT_PORT
              value: "8883"
            - name: MQTT_CA
              value: /etc/ssl/regensburg/ca.crt
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: is-holiday-mqtt-mqtt
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: is-holiday-mqtt-mqtt
                  key: password
            volumeMounts:
            - mountPath: /app/cache
              name: cache-volume
            - mountPath: /etc/ssl/regensburg
              name: regensburg-root-ca
              readOnly: true
          volumes:
          - name: cache-volume
            emptyDir:
              medium: Memory
          - name: regensburg-root-ca
            configMap:
              name: regensburg-root-ca
          restartPolicy: OnFailure
